name: Product analytics math and source-evidence checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funnel-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install first-project analytics dependencies
        run: python -m pip install -r 01_ecommerce_funnel_optimization/python/requirements.txt
      - name: Validate Python scripts and committed funnel evidence
        run: |
          python -m compileall -q 01_ecommerce_funnel_optimization/python tests
          python -m unittest discover -s tests -p 'test_*.py' -v
