name: Product analytics math and source-evidence checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funnel-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install first-project analytics dependencies
        run: python -m pip install -r 01_ecommerce_funnel_optimization/python/requirements.txt
      - name: Validate Python scripts and committed funnel evidence
        run: |
          python -m compileall -q 01_ecommerce_funnel_optimization/python tests
          python -m unittest discover -s tests -p 'test_*.py' -v
